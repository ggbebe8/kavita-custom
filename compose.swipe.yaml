services:
  tts:
    build: ./tts
    image: kavita-server-tts:edge-v1
    environment:
      KAVITA_URL: http://kavita:5000
      TTS_THREADS: ${TTS_THREADS:-2}
      TTS_CACHE_MB: ${TTS_CACHE_MB:-512}
    volumes:
      - tts-data:/data
    cpus: 2
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [kavita]
    restart: unless-stopped

  kavita:
    image: ghcr.io/kareadita/kavita@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a
    container_name: kavita
    environment:
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - ${BOOKS_PATH:-~/kavita/books}:/books
      - ${CONFIG_PATH:-~/kavita/config}:/kavita/config
    restart: unless-stopped

  swipe-proxy:
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    container_name: kavita-swipe-proxy
    ports:
      - "${PORT:-5000}:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/swipe.js:/usr/share/nginx/html/swipe.js:ro
      - ./proxy/pwa:/usr/share/nginx/html/pwa:ro
    depends_on:
      - kavita
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: kavita-caddy
    profiles:
      - https
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - swipe-proxy
    restart: unless-stopped

volumes:
  tts-data:
  caddy-data:
  caddy-config:
