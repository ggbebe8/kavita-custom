services:
  kavita:
    image: ghcr.io/kareadita/kavita:latest
    container_name: kavita
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ${BOOKS_PATH:-~/kavita/books}:/books
      - ${CONFIG_PATH:-~/kavita/config}:/kavita/config
    ports:
      - "${PORT:-5000}:5000"
    restart: unless-stopped
