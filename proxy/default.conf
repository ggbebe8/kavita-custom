map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_tokens off;
    client_max_body_size 0;
    location = /kavita-swipe.js {
        alias /usr/share/nginx/html/swipe.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://kavita:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
        sub_filter_once on;
        sub_filter '</head>' '<script defer src="/kavita-swipe.js"></script></head>';
        # HTML must be fetched again so an old cached shell cannot skip injection.
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
    }
}
