map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $kavita_forwarded_proto {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_tokens off;
    client_max_body_size 0;
    location = /kavita-offline-sw.js {
        alias /usr/share/nginx/html/pwa/offline/worker.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options nosniff;
    }
    location = /site.webmanifest {
        alias /usr/share/nginx/html/pwa/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location ^~ /kavita-pwa/ {
        alias /usr/share/nginx/html/pwa/;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location = /kavita-swipe.js {
        alias /usr/share/nginx/html/swipe.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://kavita:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $kavita_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
        sub_filter_once on;
        sub_filter '</head>' '<script src="/kavita-pwa/offline/native-bootstrap.js"></script><script defer src="/kavita-swipe.js"></script></head>';
        # HTML must be fetched again so an old cached shell cannot skip injection.
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
    }
}
