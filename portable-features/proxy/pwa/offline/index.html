<!doctype html><html lang="ko"><head><base href="/kavita-pwa/offline/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b24"><link rel="manifest" href="/site.webmanifest"><link rel="icon" href="/kavita-pwa/icon-192.png"><link rel="stylesheet" href="./offline.css"><title>Kavita 오프라인 책장</title></head><body>
<header><a href="/" id="home">Kavita</a><strong id="heading">오프라인 책장</strong><button id="sync">동기화</button></header>
<p id="status" role="status" aria-live="polite">불러오는 중…</p>
<main id="library"><p>책 상세 화면에서 읽기 버튼 옆의 <b>오프라인 저장</b> 버튼으로 책을 저장하세요. 저장한 책은 이 브라우저에서 인터넷 없이 읽을 수 있습니다.</p><p id="storage"></p><div id="books"></div><button id="export">미동기화 변경 내보내기</button><p><small>브라우저 데이터 삭제·저장 공간 정리 시 기기에 저장한 책과 미동기화 변경이 사라질 수 있습니다. 미동기화 변경이 있는 책은 이 화면에서 삭제하지 않습니다.</small></p></main>
<section id="reader" hidden><nav><button id="close">책장</button><select id="sections" aria-label="목차 구간"></select><label>글자 <input id="font" type="range" min="14" max="30" value="18" step="1"></label><button id="notes">메모</button><button id="add-note">선택한 글에 메모</button></nav><div id="stage"><iframe id="frame" title="저장한 EPUB 본문" sandbox="allow-same-origin"></iframe></div><footer><button id="prev" aria-label="이전 페이지">←</button><span id="page"></span><button id="next" aria-label="다음 페이지">→</button></footer></section>
<dialog id="notes-dialog"><h2>메모와 하이라이트</h2><div id="notes-list"></div><button data-close="notes-dialog">닫기</button></dialog>
<dialog id="edit-dialog"><form id="edit-form"><h2>메모</h2><blockquote id="quote"></blockquote><label>내용<textarea id="comment" rows="6"></textarea></label><label>강조색<select id="color"><option value="0">노랑</option><option value="1">초록</option><option value="2">파랑</option><option value="3">분홍</option><option value="4">보라</option></select></label><p>기기에 먼저 저장하며 연결되면 서버와 동기화합니다.</p><button type="submit">저장</button><button type="button" data-close="edit-dialog">취소</button></form></dialog>
<script type="module" src="./app.js"></script></body></html>
